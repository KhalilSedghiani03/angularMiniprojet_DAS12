
<div class="card mb-3" style="width: 18rem;">

  <img
    [src]="conf.imageUrl"
    class="card-img-top"
    alt="conf_image"
  >

  <div class="card-body">

    <h5 class="card-title">
      {{ conf.titre | uppercase }}
    </h5>

    <p class="card-text">
      {{ conf.category }}
    </p>

    <!-- Favoris -->
    <button
      class="btn btn-primary"
      (click)="favorite.emit(conf)"
    >
      Add to favorite
    </button>

    <!-- Like -->
    <button
      class="btn btn-success mt-2"
      (click)="like.emit(conf)"
    >
      Like ({{ conf.nbLikes }})
    </button>

  </div>
</div>
